<title>Bar Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#bfe6ff;overflow:hidden;
    font-family:'Nunito',system-ui,sans-serif;color:#1d2a4d;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#bfe6ff;touch-action:none}
  canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
  #pops{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  button{font:inherit;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid #1d2a4d;outline-offset:2px}

  .display{font-family:'Lilita One','Arial Black',sans-serif;font-weight:400;letter-spacing:.5px}
  .outline{
    color:#fff;
    text-shadow:0 4px 0 #1d2a4d,3px 0 0 #1d2a4d,-3px 0 0 #1d2a4d,0 -3px 0 #1d2a4d,
      2px 2px 0 #1d2a4d,-2px 2px 0 #1d2a4d,2px -2px 0 #1d2a4d,-2px -2px 0 #1d2a4d;
  }

  .pop{
    position:absolute;transform:translate(-50%,-50%);
    font-family:'Lilita One','Arial Black',sans-serif;font-size:30px;white-space:nowrap;
    animation:pop .9s ease-out forwards;
    text-shadow:0 3px 0 #1d2a4d,2px 0 0 #1d2a4d,-2px 0 0 #1d2a4d,0 -2px 0 #1d2a4d;
  }
  .pop.small{font-size:22px}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
    15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-190%) scale(1)}
  }

  .pill{
    display:flex;align-items:center;gap:8px;
    background:rgba(29,42,77,.55);color:#fff;border-radius:999px;
    padding:5px 14px 5px 5px;font-family:'Lilita One','Arial Black',sans-serif;font-size:20px;
    font-variant-numeric:tabular-nums;
  }
  .coin{
    display:inline-block;flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6c8 0 16%,#ffd54a 42%,#e0a100 100%);
    box-shadow:inset 0 -2px 0 #b57b00,0 0 0 2px rgba(255,255,255,.35);
  }
  .icon-btn{
    width:48px;height:48px;border-radius:14px;border:none;cursor:pointer;
    background:#3d8bff;box-shadow:0 4px 0 #2059c9;display:grid;place-items:center;pointer-events:auto;
  }
  .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2059c9}
  .icon-btn svg{width:26px;height:26px}

  /* ---------- menu ---------- */
  #menu{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:auto}
  .topbar .spacer{flex:1}
  .menu-title{margin-top:26px;text-align:center}
  .logo{font-size:66px;line-height:.88;transform:rotate(-4deg);display:inline-block}
  .logo .g{color:#ffc233}
  .lvl-badge{display:inline-block;margin-top:14px;background:#1d2a4d;color:#fff;border-radius:999px;padding:6px 18px;font-size:20px}
  .lvl-badge.bonus{background:#ff8a1f}
  .tapzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:14px}
  .hint{font-size:26px;text-align:center}
  .hand{width:66px;height:66px;animation:swipe 1.6s ease-in-out infinite}
  @keyframes swipe{0%,100%{transform:translateX(-60px) rotate(-12deg)}50%{transform:translateX(60px) rotate(10deg)}}
  .tap-text{font-size:15px;color:#fff;background:rgba(29,42,77,.55);padding:4px 12px;border-radius:999px;font-weight:900;letter-spacing:1px;margin-top:4px}
  .upgrades{display:flex;gap:12px;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto}
  .up{
    flex:1;background:#fff;border:none;border-radius:18px;box-shadow:0 5px 0 #b9cde8;
    padding:10px 10px 12px;text-align:center;cursor:pointer;color:#1d2a4d;
  }
  .up:active{transform:translateY(3px);box-shadow:0 2px 0 #b9cde8}
  .up .t{font-family:'Lilita One','Arial Black',sans-serif;font-size:16px;color:#3d8bff;letter-spacing:.5px}
  .up .lv{font-size:12px;color:#6b7a99;font-weight:900}
  .up .val{font-family:'Lilita One','Arial Black',sans-serif;font-size:24px;margin:2px 0 6px}
  .up .cost{
    display:flex;align-items:center;justify-content:center;gap:6px;
    background:#ffc233;box-shadow:0 3px 0 #d99100;border-radius:12px;padding:6px;
    font-family:'Lilita One','Arial Black',sans-serif;font-size:18px;font-variant-numeric:tabular-nums;
  }
  .up .cost .coin{width:18px;height:18px}
  .up.locked .cost{background:#dde3ee;box-shadow:0 3px 0 #b3bccc;color:#7d879b}
  .up.maxed .cost{background:#4cd964;box-shadow:0 3px 0 #2a9d44;color:#fff}

  /* ---------- hud ---------- */
  #hud{position:absolute;inset:0;z-index:10;pointer-events:none}
  .hud-top{display:flex;align-items:flex-start;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
  .lvl-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px}
  .lvl{font-size:24px}
  .progress{width:74%;max-width:220px;height:14px;background:rgba(29,42,77,.35);border-radius:999px;overflow:hidden;border:2px solid #fff}
  .progress .fill{height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#ffb300)}
  #hudHint{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;transition:opacity .4s}

  /* ---------- modals ---------- */
  .modal{position:absolute;inset:0;z-index:30;background:rgba(20,40,80,.45);display:flex;align-items:center;justify-content:center;padding:34px 22px 22px;animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0}}
  .sheet{
    position:relative;width:100%;max-width:350px;background:#fff;border-radius:24px;
    box-shadow:0 8px 0 #b9cde8;padding:44px 18px 20px;text-align:center;
    animation:rise .32s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes rise{from{transform:translateY(30px) scale(.9);opacity:0}}
  .ribbon{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    background:#3d8bff;box-shadow:0 4px 0 #2059c9;color:#fff;border-radius:14px;
    padding:8px 22px;font-size:24px;white-space:nowrap;
  }
  .ribbon.red{background:#ff4d5e;box-shadow:0 4px 0 #c2283a}
  .ribbon.green{background:#4cd964;box-shadow:0 4px 0 #2a9d44}
  .sheet-body{display:flex;flex-direction:column;gap:12px}
  .btn{
    border:none;cursor:pointer;border-radius:16px;padding:14px 18px;
    font-family:'Lilita One','Arial Black',sans-serif;font-size:22px;color:#fff;letter-spacing:.5px;
    text-shadow:0 2px 0 rgba(0,0,0,.18);
  }
  .btn:active{transform:translateY(3px)}
  .btn.green{background:#4cd964;box-shadow:0 5px 0 #2a9d44}
  .btn.blue{background:#3d8bff;box-shadow:0 5px 0 #2059c9}
  .btn.red{background:#ff4d5e;box-shadow:0 5px 0 #c2283a}
  .btn.ghost{background:#eef3fb;color:#1d2a4d;box-shadow:0 5px 0 #c9d6ea;text-shadow:none}
  .btn.small{font-size:16px;padding:10px 14px}
  .reward{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Lilita One','Arial Black',sans-serif;font-size:50px;font-variant-numeric:tabular-nums}
  .reward .coin{width:46px;height:46px}
  .mult{align-self:center;background:#ffc233;box-shadow:0 3px 0 #d99100;border-radius:999px;padding:4px 16px;font-family:'Lilita One','Arial Black',sans-serif;font-size:18px}
  .stats{color:#6b7a99;font-weight:800;font-size:14px;line-height:1.5}
  .sub{color:#6b7a99;font-weight:800;font-size:15px;margin:0 0 4px;text-wrap:balance}

  .skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:50vh;overflow:auto;padding:4px}
  .skin{
    background:#eef3fb;border-radius:16px;padding:10px 4px;border:3px solid transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;color:#1d2a4d;
  }
  .skin.on{border-color:#4cd964;background:#e8fbe9}
  .skin .fig{width:38px;height:46px}
  .skin .nm{font-weight:900;font-size:12px}
  .skin .pr{font-family:'Lilita One','Arial Black',sans-serif;font-size:14px;display:flex;gap:4px;align-items:center}
  .skin .pr .coin{width:15px;height:15px}
  .skin.locked .fig{opacity:.55}
  .srow{display:flex;align-items:center;justify-content:space-between;background:#eef3fb;border-radius:14px;padding:12px 14px;font-weight:900}
  .tog{width:56px;height:32px;border-radius:999px;background:#c9d3e3;position:relative;border:none;cursor:pointer;flex:0 0 auto}
  .tog::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:left .15s}
  .tog.on{background:#4cd964}
  .tog.on::after{left:27px}
  #loadErr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font-weight:900;z-index:50;background:#bfe6ff}
  @media (prefers-reduced-motion: reduce){ .hand{animation:none} .sheet{animation:none} }
</style>

<div id="app">
  <canvas id="fx"></canvas>
  <div id="pops"></div>

  <div id="hud" hidden>

      <div class="pill"><span class="coin"></span><span id="hudGold">0</span></div>

      </button>
    </div>
    <div id="hudHint">
      <div class="hint display outline">SWIPE TO STACK GOLD</div>
      <svg class="hand" viewBox="0 0 64 64" aria-hidden="true"><path d="M24 5c3 0 5 2 5 5v17l2-1c3-1 6 1 6 4v1c2-1 5 0 6 3 2-1 5 1 5 4v12c0 9-7 14-16 14h-4c-6 0-10-3-13-8L7 44c-2-3 0-6 3-6 2 0 4 1 5 3l4 5V10c0-3 2-5 5-5z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div id="menu">
    <div class="topbar">
      <div class="pill"><span class="coin"></span><span id="menuGold">0</span></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="shopBtn" aria-label="Skins">
        <svg viewBox="0 0 24 24"><path d="M8 3 3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c-1 2-2.4 3-4 3S9 5 8 3z" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"/></svg>

          <rect x="10.2" y="1.5" width="3.6" height="5" rx="1" transform="rotate(180 12 12)"/>

          <rect x="10.2" y="1.5" width="3.6" height="5" rx="1" transform="rotate(315 12 12)"/>
          <circle cx="12" cy="12" r="7"/></g><circle cx="12" cy="12" r="3" fill="#3d8bff"/></svg>
      </button>
    </div>
    <div class="menu-title">
      <div class="logo display outline">BAR<br><span class="g">RUSH</span></div><br>

    </div>
    <div class="tapzone">
      <div class="hint display outline">SWIPE TO STACK GOLD</div>
      <svg class="hand" viewBox="0 0 64 64" aria-hidden="true"><path d="M24 5c3 0 5 2 5 5v17l2-1c3-1 6 1 6 4v1c2-1 5 0 6 3 2-1 5 1 5 4v12c0 9-7 14-16 14h-4c-6 0-10-3-13-8L7 44c-2-3 0-6 3-6 2 0 4 1 5 3l4 5V10c0-3 2-5 5-5z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/></svg>
      <div class="tap-text">TAP ANYWHERE TO PLAY</div>
    </div>
    <div class="upgrades">
      <button class="up" id="upStart">
        <div class="t">START GOLD</div><div class="lv" id="upStartLv">LV 1</div>

        <div class="cost"><span class="coin"></span><span id="upStartCost">60</span></div>
      </button>
      <button class="up" id="upIncome">
        <div class="t">INCOME</div><div class="lv" id="upIncomeLv">LV 1</div>
        <div class="val" id="upIncomeVal">x1.0</div>
        <div class="cost"><span class="coin"></span><span id="upIncomeCost">100</span></div>
      </button>

  <div class="modal" id="pauseModal" hidden>
    <div class="sheet"><div class="ribbon display">PAUSED</div>
      <div class="sheet-body">
        <button class="btn green" id="resumeBtn">RESUME</button>
        <button class="btn blue" id="restartBtn">RESTART LEVEL</button>
        <button class="btn ghost" id="quitBtn">MAIN MENU</button>
      </div>

  <div class="modal" id="winModal" hidden>
    <div class="sheet"><div class="ribbon green display" id="winTitle">LEVEL 1 COMPLETE!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const app = $("app");

if(typeof THREE === "undefined"){
  const d = document.createElement("div");
  d.id = "loadErr";
  d.textContent = "The 3D engine could not load. Check your internet connection and reload the page.";
  app.appendChild(d);
  return;
}

/* =============================== SAVE =============================== */
const SAVE_KEY = "barRush3d_v1";
const SKINS = [
  {id:"red",    name:"Classic",   color:0xff3b3b, cost:0},
  {id:"blue",   name:"Ocean",     color:0x3d8bff, cost:400},
  {id:"green",  name:"Lime",      color:0x4cd964, cost:900},
  {id:"purple", name:"Grape",     color:0x9b5cff, cost:1600},
  {id:"orange", name:"Tiger",     color:0xff8a1f, cost:2600},
  {id:"pink",   name:"Bubblegum", color:0xff6bb5, cost:4000},
  {id:"black",  name:"Shadow",    color:0x2d3142, cost:6500},
  {id:"white",  name:"Ghost",     color:0xf2f5ff, cost:10000},
  {id:"gold",   name:"Golden",    color:0xffc233, cost:16000},
];
function defSave(){ return {gold:0, level:1, upStart:0, upIncome:0, owned:["red"], skin:"red", sound:true, music:true, vibe:true, best:0}; }
let save = defSave();
try{ const r = localStorage.getItem(SAVE_KEY); if(r) save = Object.assign(defSave(), JSON.parse(r)); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const MAX_UP = 30;
const startValue  = () => 100 + save.upStart*25;
const incomeMult  = () => 1 + save.upIncome*0.1;
const startCost   = () => Math.round(60*Math.pow(1.5, save.upStart)/10)*10;
const incomeCost  = () => Math.round(100*Math.pow(1.55, save.upIncome)/10)*10;
function fmt(n){
  n = Math.round(n);
  if(n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n >= 1e4) return (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,"")+"K";
  return n.toLocaleString("en-US");
}

/* =============================== AUDIO =============================== */
let AC = null, master = null;
function ac(){
  if(!AC){
    try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination); }catch(e){ AC = null; }
  }
  if(AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(f, d, type, vol, delay){
  if(!save.sound) return;
  const c = ac(); if(!c) return;
  const t = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.15, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.03);
}
const SFX = {
  coin:  () => { tone(1320,0.07,"square",0.045); tone(1760,0.09,"square",0.04,0.045); },
  good:  () => { tone(523,0.1,"triangle",0.14); tone(659,0.1,"triangle",0.14,0.07); tone(784,0.16,"triangle",0.14,0.14); },
  bad:   () => { tone(330,0.18,"sawtooth",0.09); tone(220,0.26,"sawtooth",0.09,0.1); },
  hit:   () => { tone(110,0.28,"square",0.13); tone(80,0.3,"sawtooth",0.08,0.04); },
  step:  i  => { tone(392*Math.pow(2,i/10),0.12,"triangle",0.15); },
  win:   () => { [523,659,784,1046].forEach((f,i)=>tone(f,0.24,"triangle",0.15,i*0.1)); },
  fail:  () => { [392,330,262].forEach((f,i)=>tone(f,0.3,"sawtooth",0.08,i*0.16)); },
  click: () => tone(720,0.05,"square",0.05),
  buy:   () => { tone(880,0.08,"triangle",0.12); tone(1320,0.12,"triangle",0.12,0.07); },
};
let musicTimer = null, nextNoteT = 0, noteIdx = 0;
const MEL  = [0,4,7,9, 7,4,2,4, 0,4,7,12, 9,7,4,2];
const BASS = [0,0,5,5,7,7,5,5];
function mnote(f, t, d, type, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.05);
}
function startMusic(){
  if(!save.music || musicTimer) return;
  const c = ac(); if(!c) return;
  nextNoteT = c.currentTime + 0.05;
  musicTimer = setInterval(()=>{
    while(nextNoteT < AC.currentTime + 0.25){
      mnote(523.25*Math.pow(2, MEL[noteIdx%16]/12), nextNoteT, 0.2, "triangle", 0.03);
      if(noteIdx%2===0) mnote(130.8*Math.pow(2, BASS[(noteIdx>>1)%8]/12), nextNoteT, 0.45, "sine", 0.055);
      nextNoteT += 0.27; noteIdx++;
    }
  }, 60);
}
function stopMusic(){ clearInterval(musicTimer); musicTimer = null; }

(function buildEnvironment(){
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 1100), new THREE.MeshLambertMaterial({color:0x8fd46a}));

  let seed = 11;
  const rnd = () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; };
  for(let z=40; z>ENV_FAR; z-=13){
    for(const s of [-1,1]){
      const r = 12 + rnd()*26;
      const m = new THREE.Mesh(hillGeo, hillMats[(rnd()*hillMats.length)|0]);
      m.scale.set(r, r*(0.3+rnd()*0.3), r*(0.8+rnd()*0.5));

      scene.add(m);
    }
  }
  // distant horizon hills
  for(let i=0;i<14;i++){
    const r = 60 + rnd()*50;
    const m = new THREE.Mesh(hillGeo, hillMats[i%4]);
    m.scale.set(r, r*0.35, r*0.6);
    m.position.set((rnd()-0.5)*420, GROUND_Y - 4, ENV_FAR - 40 - rnd()*60);
    scene.add(m);
  }

  // low-poly trees, instanced
  const treeSpots = [];
  for(let z=30; z>ENV_FAR; z-=5.2){
    for(const s of [-1,1]){
      if(rnd()<0.82) treeSpots.push([s*(6.8 + rnd()*7), z - rnd()*3, 1.9 + rnd()*1.2]);
      if(rnd()<0.55) treeSpots.push([s*(16 + rnd()*40), z - rnd()*4, 2.2 + rnd()*1.6]);
    }
  }
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.3, 1.3, 6); trunkGeo.translate(0, 0.65, 0);
  const c1 = new THREE.ConeGeometry(1.5, 2.1, 7); c1.translate(0, 2.0, 0);

  const trunkMat = new THREE.MeshLambertMaterial({color:0x8a5a33});
  const leafMat = new THREE.MeshPhongMaterial({color:0xffffff, flatShading:true, shininess:8});
  const n = treeSpots.length;
  const meshes = [new THREE.InstancedMesh(trunkGeo, trunkMat, n)].concat([c1,c2,c3].map(gm=>new THREE.InstancedMesh(gm, leafMat, n)));
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  const greens = [0x2fa84f, 0x3cb95a, 0x27954a, 0x49c267];
  treeSpots.forEach((t,i)=>{
    dummy.position.set(t[0], GROUND_Y, t[1]);
    dummy.rotation.set(0, rnd()*6.28, 0);
    dummy.scale.setScalar(t[2]);
    dummy.updateMatrix();
    col.setHex(greens[(rnd()*greens.length)|0]);
    meshes.forEach((m,k)=>{ m.setMatrixAt(i, dummy.matrix); if(k>0) m.setColorAt(i, col); });
  });
  meshes.forEach(m=>{ m.instanceMatrix.needsUpdate = true; if(m.instanceColor) m.instanceColor.needsUpdate = true; scene.add(m); });

  // clouds
  const cloudMat = new THREE.MeshLambertMaterial({color:0xffffff, emissive:0x8899aa});
  for(let i=0;i<16;i++){
    const g = new THREE.Group();
    for(let k=0;k<4;k++){
      const p = new THREE.Mesh(hillGeo, cloudMat);
      const r = 3 + rnd()*3;
      p.scale.set(r, r*0.6, r*0.8); p.position.set(k*3.8 - 6, rnd()*1.5, rnd()*2);
      g.add(p);
    }
    g.position.set((rnd()<0.5?-1:1)*(30 + rnd()*60), 26 + rnd()*14, 20 - i*48);
    scene.add(g);
  }
})();

const ROAD_W = 6, HALF = 3, MAXX = HALF - 0.5;

function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0)/4294967296; }; }
let rng = Math.random;

let L = 200, speed = 9, isBonus = false, stepCost = 100;
let gates = [], pickups = [], obstacles = [], steps = [], stepBarsPlaced = [];

function gateLabel(o){
  if(o.kind==="add") return "+"+fmt(o.n);
  if(o.kind==="sub") return "-"+fmt(o.n);
  if(o.kind==="mul") return "x"+o.n;
  return "÷"+o.n;
}
const isGood = o => o.kind==="add" || o.kind==="mul";
function gateTexture(o){
  return track(canvasTex(300, 365, (x,w,h)=>{
    const col = isGood(o) ? "61,139,255" : "255,77,94";
    const gr = x.createLinearGradient(0,0,0,h);

    x.fillStyle = gr; x.fillRect(0,0,w,h);
    x.strokeStyle = "rgba(255,255,255,0.9)"; x.lineWidth = 8; x.strokeRect(4,4,w-8,h-8);
    outlinedText(x, gateLabel(o), w/2, 70, 86);
  }));
}
function genGateOpts(lv){
  const base = 60 + lv*25;
  const r10 = v => Math.max(10, Math.round(v/10)*10);
  const add = () => ({kind:"add", n:r10(base*(0.8 + rng()*1.8))});
  const sub = () => ({kind:"sub", n:r10(base*(0.5 + rng()*1.2))});
  const mul = () => ({kind:"mul", n:(lv>=4 && rng()<0.25) ? 3 : 2});
  const div = () => ({kind:"div", n:2});
  let a, b; const r = rng();
  if(isBonus){ a = rng()<0.5 ? mul() : add(); b = add(); }
  else if(r < 0.24){ a = add(); b = add(); if(a.n===b.n) b.n += 50; }
  else if(r < 0.5){ a = add(); b = sub(); }
  else if(r < 0.72){ a = mul(); b = add(); }
  else if(r < 0.86){ a = mul(); b = sub(); }
  else { a = sub(); b = div(); }
  return rng()<0.5 ? [a,b] : [b,a];
}

function addGate(z){
  const opts = genGateOpts(save.level);
  const panels = opts.map((o,i)=>{
    const mat = track(new THREE.MeshBasicMaterial({map:gateTexture(o), transparent:true, depthWrite:false, side:THREE.DoubleSide}));
    const m = new THREE.Mesh(G.gatePlane, mat);
    m.position.set(i===0 ? -1.5 : 1.5, 1.8, z);
    levelGroup.add(m); return m;
  });
  for(const x of [-2.96, 0, 2.96]){
    const p = new THREE.Mesh(G.post, G.postMat); p.position.set(x, 1.95, z); p.castShadow = true; levelGroup.add(p);
  }
  gates.push({z, opts, panels, done:false, chosen:-1, t:0});
}
function addBars(z, lv){
  const v = 10 + lv*2;
  const pat = rng();
  const lane = [-1.6,0,1.6][(rng()*3)|0];
  for(let k=0;k<6;k++){
    const x = pat < 0.55 ? lane : (pat < 0.78 ? -2 + k*0.8 : 2 - k*0.8);
    const m = new THREE.Mesh(G.bar, G.barMat);
    m.position.set(x, 0.35, z - k*1.5); m.castShadow = true;
    levelGroup.add(m);
    pickups.push({x, z:z - k*1.5, v, mesh:m, taken:false});
  }
}
function addObstacle(z, lv){
  const types = lv===1 ? ["wall"] : lv===2 ? ["wall","wall","hammer"] : ["wall","hammer","saw"];
  const type = types[(rng()*types.length)|0];
  if(type==="wall"){
    const side = rng()<0.5 ? -1 : 1;
    const g = new THREE.Group();
    const base = new THREE.Mesh(track(new THREE.BoxGeometry(2.8, 0.9, 0.5)), G.wallMat);
    base.position.y = 0.45; base.castShadow = true; g.add(base);
    for(let i=0;i<6;i++){ const s = new THREE.Mesh(G.spike, G.metal); s.position.set(-1.15 + i*0.46, 1.15, 0); g.add(s); }
    g.position.set(side*1.5, 0, z); levelGroup.add(g);
    obstacles.push({type, z, x:side*1.5, hit:false});
  } else if(type==="hammer"){
    const frame = new THREE.Group();
    for(const x of [-3.25, 3.25]){ const p = new THREE.Mesh(track(new THREE.BoxGeometry(0.3, 6, 0.3)), G.darkMat); p.position.set(x, 3, 0); frame.add(p); }
    const bar = new THREE.Mesh(track(new THREE.BoxGeometry(6.8, 0.3, 0.3)), G.darkMat); bar.position.y = 5.85; frame.add(bar);
    const pivot = new THREE.Group(); pivot.position.y = 5.7; frame.add(pivot);
    const arm = new THREE.Mesh(G.hammerArm, G.metal); arm.position.y = -2.1; pivot.add(arm);
    const headM = new THREE.Mesh(G.hammerHead, G.redMat); headM.position.y = -4.2; headM.castShadow = true; pivot.add(headM);
    frame.position.z = z; levelGroup.add(frame);
    obstacles.push({type, z, pivot, w:2.1 + Math.min(1, lv*0.04), ph:rng()*6.28, hit:false, angle:0});
  } else {
    const g = new THREE.Group();
    const slot = new THREE.Mesh(track(new THREE.BoxGeometry(5.4, 0.03, 0.3)), G.darkMat); slot.position.y = 0.02; g.add(slot);
    const blade = new THREE.Group();
    const disc = new THREE.Mesh(G.saw, G.metal); disc.castShadow = true; blade.add(disc);
    blade.add(new THREE.Mesh(G.sawCore, G.redMat));
    blade.position.y = 0.5; g.add(blade);
    g.position.z = z; levelGroup.add(g);
    obstacles.push({type, z, blade, x:0, w:1.4 + Math.min(0.9, lv*0.05), ph:rng()*6.28, hit:false});
  }
}

function buildLevel(lv){
  clearLevel();
  gates = []; pickups = []; obstacles = []; steps = []; stepBarsPlaced = [];
  rng = mulberry(lv*7919 + 13);
  isBonus = lv % 5 === 0;
  L = Math.min(520, 150 + lv*16);
  speed = Math.min(12.5, 9 + lv*0.12);
  stepCost = 80 + lv*20;

  // road
  const len = L + 18;
  const roadGeo = track(new THREE.BoxGeometry(ROAD_W, 1.2, len));
  const stripes = track(new THREE.CanvasTexture(stripeCanvas));
  stripes.wrapS = stripes.wrapT = THREE.RepeatWrapping; stripes.repeat.set(1, len/2.4);
  stripes.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const topMat = track(new THREE.MeshLambertMaterial({map:stripes}));
  const road = new THREE.Mesh(roadGeo, [G.roadSide, G.roadSide, topMat, G.roadSide, G.roadSide, G.roadSide]);
  road.position.set(0, -0.6, 10 - len/2); road.receiveShadow = true;
  levelGroup.add(road);
  const railGeo = track(new THREE.BoxGeometry(0.2, 0.28, len));
  for(const s of [-1,1]){ const r = new THREE.Mesh(railGeo, G.rail); r.position.set(s*(HALF+0.1), 0.1, 10 - len/2); levelGroup.add(r); }
  const pillarGeo = track(new THREE.BoxGeometry(1.1, -GROUND_Y - 1.2, 1.1));
  for(let z=0; z>-len; z-=22){
    for(const s of [-1,1]){ const p = new THREE.Mesh(pillarGeo, G.pillar); p.position.set(s*2, (GROUND_Y-1.2)/2, z); levelGroup.add(p); }
  }

  // content rows
  let z = -18, row = 0, last = "";
  const d = Math.min(1, (lv-1)/14);
  while(z > -L + 14){
    let kind;
    if(row===0) kind = "bars";
    else if(row===1) kind = "gate";
    else {
      const r = rng();
      const pObs = isBonus ? 0 : (lv===1 ? 0.2 : 0.28 + 0.14*d);
      kind = r < pObs ? "obs" : (r < pObs + 0.42 ? "gate" : "bars");
      if(kind===last && kind!=="gate") kind = "gate";
    }
    if(kind==="gate") addGate(z);
    else if(kind==="obs") addObstacle(z, lv);
    else addBars(z, lv);
    last = kind; row++;
    z -= (kind==="bars" ? 16 : 13) + rng()*4 - d*2;
  }

  // finish line + arch
  const fz = -L;
  const strip = new THREE.Mesh(track(new THREE.PlaneGeometry(ROAD_W, 1.4)), track(new THREE.MeshLambertMaterial({map:G.checker})));
  strip.rotation.x = -Math.PI/2; strip.position.set(0, 0.015, fz); levelGroup.add(strip);
  for(const s of [-1,1]){ const p = new THREE.Mesh(track(new THREE.BoxGeometry(0.4, 4.6, 0.4)), G.redMat); p.position.set(s*3.3, 2.3, fz); p.castShadow = true; levelGroup.add(p); }
  const banner = new THREE.Mesh(track(new THREE.PlaneGeometry(7, 1.3)), track(new THREE.MeshBasicMaterial({map:G.finishTex, side:THREE.DoubleSide})));
  banner.position.set(0, 4.6, fz); levelGroup.add(banner);

  // multiplier stairs
  const MULTS = [1.2,1.4,1.6,1.8,2,2.5,3,3.5,4,5];
  const COLS = [0xff5a5a,0xff8c42,0xffc93c,0x9be15d,0x3ddc97,0x3ec5ff,0x4d8bff,0x8a6cff,0xd66bff,0xff6bb5];
  const zS = fz - 4, D = 2.4;
  for(let i=0;i<10;i++){
    const top = (i+1)*0.55, depth = i===9 ? 7 : D;
    const hgt = top + 1.2;
    const zFront = zS - i*D;
    const box = new THREE.Mesh(track(new THREE.BoxGeometry(ROAD_W, hgt, depth)), track(new THREE.MeshLambertMaterial({color:COLS[i]})));
    box.position.set(0, top - hgt/2, zFront - depth/2); box.receiveShadow = true;
    levelGroup.add(box);
    const lt = track(canvasTex(256, 64, (x,w,h)=>outlinedText(x, "x"+MULTS[i], w/2, h/2+2, 46)));
    const lab = new THREE.Mesh(track(new THREE.PlaneGeometry(2, 0.5)), track(new THREE.MeshBasicMaterial({map:lt, transparent:true})));
    lab.position.set(0, top - 0.27, zFront + 0.01); levelGroup.add(lab);
    steps.push({zFront, top, mult:MULTS[i]});
  }
  const topY = steps[9].top, mz = steps[9].zFront - 5.2;
  const machine = new THREE.Group();
  const mb = new THREE.Mesh(track(new THREE.BoxGeometry(4.8, 3.4, 2.4)), track(new THREE.MeshPhongMaterial({color:0x4f6bff, shininess:50})));
  mb.position.y = 1.7; mb.castShadow = true; machine.add(mb);
  const roof = new THREE.Mesh(track(new THREE.CylinderGeometry(0, 3.6, 1.6, 4)), track(new THREE.MeshPhongMaterial({color:0xffc233, shininess:60, flatShading:true})));
  roof.rotation.y = Math.PI/4; roof.scale.set(1, 1, 0.55); roof.position.y = 4.2; machine.add(roof);
  const sign = new THREE.Mesh(track(new THREE.PlaneGeometry(4.2, 2.1)), track(new THREE.MeshBasicMaterial({map:G.bankTex})));
  sign.position.set(0, 1.9, 1.21); machine.add(sign);
  machine.position.set(0, topY, mz); levelGroup.add(machine);

  resetPlayer();
  refreshHud();
}

/* =============================== GAME STATE =============================== */
let state = "menu";
let value = 100, finishValue = 0, px = 0, targetX = 0, pz = 4, py = 0, runPhase = 0;
let slowT = 0, shake = 0, flashT = 0, time = 0, stepIdx = -1, celebrateT = 0, failT = 0;
let shownLayers = 0, towerH = 0, lastLabel = -1, reward = 0, mult = 1, gatesTaken = 0, hitsTaken = 0;
const debris = [];

function resetPlayer(){
  value = startValue(); px = 0; targetX = 0; pz = 4; py = 0; stepIdx = -1;
  slowT = 0; shake = 0; flashT = 0; failT = 0; celebrateT = 0; gatesTaken = 0; hitsTaken = 0;
  shownLayers = layersFor(value); towerH = shownLayers*LAYER_H;
  player.rotation.set(0,0,0); body.rotation.set(0,0,0);
  player.position.set(px, py + towerH, pz);
  tower.position.set(px, py, pz);
  debris.forEach(d=>scene.remove(d.m)); debris.length = 0;
  lastLabel = -1;
}

/* ---------- popups ---------- */
const popLayer = $("pops");
const tmpV = new THREE.Vector3();
function popup(text, color, yOff, small){
  tmpV.set(player.position.x, player.position.y + (yOff||2.4), player.position.z);
  tmpV.project(camera);
  const el = document.createElement("div");
  el.className = "pop" + (small ? " small" : "");
  el.textContent = text; el.style.color = color;
  el.style.left = ((tmpV.x+1)/2*app.clientWidth + (Math.random()-0.5)*30) + "px";
  el.style.top = ((1-tmpV.y)/2*app.clientHeight) + "px";
  popLayer.appendChild(el);
  setTimeout(()=>el.remove(), 950);
}
function spawnDebris(n){
  for(let i=0;i<n;i++){
    const m = new THREE.Mesh(G.bar, G.barMat);
    m.position.set(px + (Math.random()-0.5)*0.6, py + 0.1 + Math.random()*Math.max(0.3, towerH), pz - 0.3);
    scene.add(m);
    debris.push({m, vx:(Math.random()-0.5)*7, vy:3 + Math.random()*5, vz:1 + Math.random()*4, rx:(Math.random()-0.5)*12, rz:(Math.random()-0.5)*12, t:0});
  }
}

/* ---------- value changes ---------- */
function applyGate(o){
  const before = value;
  if(o.kind==="add") value += o.n;
  else if(o.kind==="sub") value -= o.n;
  else if(o.kind==="mul") value *= o.n;
  else value = Math.floor(value / o.n);
  value = Math.max(0, Math.round(value));
  const delta = value - before;
  gatesTaken++;
  popup(gateLabel(o), isGood(o) ? "#7dff8a" : "#ff6b7a");
  if(delta >= 0){ SFX.good(); buzz(15); }
  else { SFX.bad(); buzz(40); spawnDebris(Math.min(10, 2 + 2*(layersFor(before) - layersFor(value)))); }
  if(value <= 0) fail();
}
function takeHit(pct){
  const loss = Math.max(1, Math.ceil(value*pct));
  const before = value;
  value = Math.max(0, value - loss);
  hitsTaken++;
  SFX.hit(); buzz(70);
  shake = 0.4; slowT = 0.4; flashT = 0.35;
  spawnDebris(Math.min(12, 3 + 2*(layersFor(before) - layersFor(value))));
  popup("-"+fmt(loss), "#ff6b7a");
  if(value <= 0) fail();
}

/* ---------- flow ---------- */
const menuEl = $("menu"), hudEl = $("hud");
function show(el, on){ el.hidden = !on; }
function refreshMenu(){
  $("menuGold").textContent = fmt(save.gold);
  const lb = $("menuLevel");
  lb.textContent = (save.level % 5 === 0 ? "BONUS " : "") + "LEVEL " + save.level;
  lb.classList.toggle("bonus", save.level % 5 === 0);
  const sMax = save.upStart >= MAX_UP, iMax = save.upIncome >= MAX_UP;
  $("upStartLv").textContent = "LV " + (save.upStart+1);
  $("upStartVal").textContent = fmt(startValue());
  $("upStartCost").textContent = sMax ? "MAX" : fmt(startCost());
  $("upStart").classList.toggle("locked", !sMax && save.gold < startCost());
  $("upStart").classList.toggle("maxed", sMax);
  $("upIncomeLv").textContent = "LV " + (save.upIncome+1);
  $("upIncomeVal").textContent = "x" + incomeMult().toFixed(1);
  $("upIncomeCost").textContent = iMax ? "MAX" : fmt(incomeCost());
  $("upIncome").classList.toggle("locked", !iMax && save.gold < incomeCost());
  $("upIncome").classList.toggle("maxed", iMax);
}
function refreshHud(){
  $("hudGold").textContent = fmt(save.gold);
  $("hudLevel").textContent = (isBonus ? "BONUS " : "") + "LEVEL " + save.level;
}
function toMenu(){
  state = "menu";
  ["pauseModal","winModal","failModal"].forEach(id=>show($(id), false));
  show(hudEl, false); show(menuEl, true);
  buildLevel(save.level);
  refreshMenu();
}
function startRun(){
  if(state !== "menu") return;
  ac(); startMusic();
  state = "playing";
  show(menuEl, false); show(hudEl, true);
  $("hudHint").style.opacity = save.level <= 2 ? "1" : "0";
  hintTimer = save.level <= 2 ? 2.5 : 0;
  refreshHud();
}
let hintTimer = 0;
function fail(){
  if(state === "failed") return;
  state = "failed"; failT = 0;
  SFX.fail(); buzz([60,40,60]);
  spawnDebris(Math.min(12, 2 + Math.round(shownLayers)*2));
  setTimeout(()=>{ if(state==="failed") show($("failModal"), true); }, 1000);
}
function startFinish(){
  state = "finish";
  finishValue = value; stepIdx = -1;
  targetX = 0;
}
function celebrate(){
  if(state === "celebrate") return;
  state = "celebrate"; celebrateT = 0;
  mult = stepIdx >= 0 ? steps[stepIdx].mult : 1;
  reward = Math.round(finishValue * mult * incomeMult());
  SFX.win(); buzz([30,50,30]);
  burst();
  setTimeout(()=>{
    if(state !== "celebrate") return;
    state = "won";
    $("winTitle").textContent = "LEVEL " + save.level + " COMPLETE!";
    $("winMult").textContent = "x" + mult + " MULTIPLIER";
    $("winStats").innerHTML = "Carried " + fmt(finishValue) + " gold &middot; Climbed " + (stepIdx+1) + "/10 steps" +
      (incomeMult() > 1 ? "<br>Income bonus x" + incomeMult().toFixed(1) : "");
    show($("winModal"), true);
    countUp($("winReward"), reward);
  }, 1400);
}
function countUp(el, target){
  const t0 = performance.now(), dur = 900;
  (function step(now){
    const k = Math.min(1, (now - t0)/dur);
    el.textContent = fmt(target * (1 - Math.pow(1-k, 3)));
    if(k < 1) requestAnimationFrame(step);
  })(t0);
}

/* =============================== UPDATE =============================== */
const keys = {left:false, right:false};
const camPos = new THREE.Vector3(0, 6, 12), camLook = new THREE.Vector3(0, 1, -4), tmpT = new THREE.Vector3();

function update(dt){
  time += dt;
  for(const o of obstacles){
    if(o.type==="hammer"){ o.angle = Math.sin(time*o.w + o.ph)*1.2; o.pivot.rotation.z = o.angle; }
    else if(o.type==="saw"){ o.x = Math.sin(time*o.w + o.ph)*2.25; o.blade.position.x = o.x; o.blade.rotation.z -= dt*14; }
  }
  for(const b of pickups){
    if(!b.taken){ b.mesh.rotation.y += dt*2.2; b.mesh.position.y = 0.38 + Math.sin(time*3 + b.z)*0.08; }
  }
  for(const g of gates){
    if(g.chosen >= 0 && g.t < 1){
      g.t = Math.min(1, g.t + dt*3);
      g.panels.forEach((p,i)=>{
        p.material.opacity = 1 - g.t;
        if(i===g.chosen) p.scale.setScalar(1 + g.t*0.35);
      });
    }
  }

  if(state==="playing") playUpdate(dt);
  else if(state==="finish") finishUpdate(dt);
  else if(state==="celebrate" || state==="won") celebrateT += dt;
  else if(state==="failed") failT += dt;

  if(hintTimer > 0){ hintTimer -= dt; if(hintTimer <= 0) $("hudHint").style.opacity = "0"; }

  animatePlayer(dt);
  updateStack(dt);
  updateDebris(dt);
  updateCamera(dt);
}

function playUpdate(dt){
  const sp = speed * (slowT > 0 ? 0.5 : 1);
  slowT = Math.max(0, slowT - dt);
  if(keys.left) targetX -= 8*dt;
  if(keys.right) targetX += 8*dt;
  targetX = Math.max(-MAXX, Math.min(MAXX, targetX));
  px += (targetX - px) * Math.min(1, dt*14);
  const prevZ = pz;
  pz -= sp*dt;
  runPhase += sp*dt*1.3;

  for(const g of gates){
    if(!g.done && prevZ > g.z && pz <= g.z){
      g.done = true;
      g.chosen = px < 0 ? 0 : 1;
      applyGate(g.opts[g.chosen]);
      if(state !== "playing") return;
    }
  }
  for(const b of pickups){
    if(!b.taken && Math.abs(b.z - pz) < 0.8 && Math.abs(b.x - px) < 0.9){
      b.taken = true; b.mesh.visible = false;
      value += b.v; SFX.coin();
      popup("+"+b.v, "#ffe066", 2.2, true);
    }
  }
  for(const o of obstacles){
    if(o.hit) continue;
    if(o.type==="wall"){
      if(pz <= o.z + 0.45 && prevZ >= o.z - 0.45 && Math.abs(px - o.x) < 1.72){ o.hit = true; takeHit(0.3); targetX = o.x > 0 ? -1.5 : 1.5; }
    } else if(o.type==="hammer"){
      const hx = Math.sin(o.angle)*4.2, hy = 5.7 - Math.cos(o.angle)*4.2;
      if(pz <= o.z + 0.85 && prevZ >= o.z - 0.85 && hy < 2.1 && Math.abs(hx - px) < 1.0){
        o.hit = true; takeHit(0.25);
        targetX = Math.max(-MAXX, Math.min(MAXX, px + (px >= hx ? 1.8 : -1.8)));
      }
    } else if(o.type==="saw"){
      if(pz <= o.z + 0.5 && prevZ >= o.z - 0.5 && Math.abs(o.x - px) < 1.05){ o.hit = true; takeHit(0.2); }
    }
    if(state !== "playing") return;
  }
  $("hudProg").style.width = (Math.max(0, Math.min(1, (4 - pz)/(L + 4)))*100) + "%";
  if(pz <= -L) startFinish();
}

function finishUpdate(dt){
  px += (0 - px) * Math.min(1, dt*6);
  pz -= 7*dt;
  runPhase += 7*dt*1.3;
  const next = steps[stepIdx+1];
  if(next && pz <= next.zFront + 0.35){
    if(value >= stepCost){
      stepIdx++;
      value -= stepCost;
      SFX.step(stepIdx); buzz(12);
      popup("x"+next.mult, "#ffe066", 2.6);
      for(let k=0;k<3;k++){
        const m = new THREE.Mesh(G.bar, G.barMat);
        m.position.set(-1.8 + k*1.8 + (Math.random()-0.5)*0.4, next.top + 0.09, next.zFront - 0.9 - Math.random()*0.8);
        m.rotation.y = Math.random()*0.6; levelGroup.add(m);
      }
    } else {
      pz = next.zFront + 0.35;
      celebrate();
    }
  }
  if(!next && pz <= steps[9].zFront - 3){ pz = steps[9].zFront - 3; celebrate(); }
  const ty = stepIdx >= 0 ? steps[stepIdx].top : 0;
  py += (ty - py) * Math.min(1, dt*16);
  $("hudProg").style.width = "100%";
}

function animatePlayer(dt){
  const moving = state==="playing" || state==="finish";
  let bob = 0;
  if(moving){
    const s = Math.sin(runPhase*2.4);
    legL.rotation.x = s*0.85; legR.rotation.x = -s*0.85;
    armL.rotation.x = -s*0.75; armR.rotation.x = s*0.75;
    bob = Math.abs(Math.cos(runPhase*2.4))*0.08;
    body.rotation.z += (-(targetX - px)*0.12 - body.rotation.z) * Math.min(1, dt*8);
    body.rotation.x = 0;
  } else if(state==="celebrate" || state==="won"){
    const s = Math.sin(celebrateT*9);
    bob = Math.abs(s)*0.55;
    legL.rotation.x = legR.rotation.x = 0;
    armL.rotation.x = armR.rotation.x = Math.PI - 0.3 + s*0.25;
    body.rotation.y += dt*3;
    body.rotation.z *= 0.9;
  } else if(state==="failed"){
    body.rotation.x += (-Math.PI/2 - body.rotation.x) * Math.min(1, dt*6);
    legL.rotation.x = legR.rotation.x = 0;
    armL.rotation.x = armR.rotation.x = 2.6;
  } else {
    const s = Math.sin(time*2);
    legL.rotation.x = legR.rotation.x = 0;
    armL.rotation.x = armR.rotation.x = 0.08 + s*0.04;
    bob = s*0.02;
    body.rotation.z *= 0.9; body.rotation.x = 0;
    if(state==="menu") body.rotation.y *= 0.9;
  }
  if(state!=="celebrate" && state!=="won") body.rotation.y *= 0.9;
  player.position.set(px, py + towerH + 0.1 + bob, pz);
  tower.position.set(px, py, pz);
  if(flashT > 0){
    flashT -= dt;
    skinMat.emissive.setHex(Math.sin(flashT*40) > 0 ? 0xaa0000 : 0x000000);
    if(flashT <= 0) skinMat.emissive.setHex(0x000000);
  }
}

function updateStack(dt){
  const target = state==="failed" ? 0 : layersFor(value);
  const diff = target - shownLayers;
  shownLayers += Math.sign(diff) * Math.min(Math.abs(diff), dt*30);
  const n = Math.round(shownLayers);
  const sway = targetX - px;
  towerLayers.forEach((l,i)=>{
    const vis = i < n;
    if(vis && !l.visible){ l.visible = true; l.userData.s = 0.3; }
    if(!vis) l.visible = false;
    if(l.visible){
      l.userData.s += (1 - l.userData.s) * Math.min(1, dt*14);
      l.scale.setScalar(l.userData.s);
      l.position.x = sway * (n - i) * 0.006;
    }
  });
  towerH += (n*LAYER_H - towerH) * Math.min(1, dt*14);
  const lv = Math.round(value);
  if(lv !== lastLabel){ drawLabel(lv); lastLabel = lv; }
  label.position.y = 2.5;
  label.visible = state !== "failed";
}

function updateDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const d = debris[i];
    d.t += dt; d.vy -= 20*dt;
    d.m.position.x += d.vx*dt; d.m.position.y += d.vy*dt; d.m.position.z += d.vz*dt;
    d.m.rotation.x += d.rx*dt; d.m.rotation.z += d.rz*dt;
    if(d.t > 1.8){ scene.remove(d.m); debris.splice(i,1); }
  }
}

function updateCamera(dt){
  let oy = 6.3, oz = 8.6, look = 6.5;
  if(state==="menu"){ oy = 4.8; oz = 7.6; look = 5; }
  if(state==="finish" || state==="celebrate" || state==="won"){ oy = 7.8; oz = 11.5; look = 4; }
  tmpT.set(px*0.35, py + oy + towerH*0.7, pz + oz + towerH*0.35);
  camPos.lerp(tmpT, Math.min(1, dt*5));
  tmpT.set(px*0.2, py + 1.1 + towerH*0.5, pz - look);
  camLook.lerp(tmpT, Math.min(1, dt*6));
  camera.position.copy(camPos);
  if(shake > 0){
    shake = Math.max(0, shake - dt);
    camera.position.x += (Math.random()-0.5)*shake*0.8;
    camera.position.y += (Math.random()-0.5)*shake*0.8;
  }
  camera.lookAt(camLook);
  sun.position.set(px + 6, py + 16, pz + 8);
  sun.target.position.set(px, py, pz - 4);
}

/* =============================== CONFETTI =============================== */
const fx = $("fx"), fctx = fx.getContext("2d");
let confetti = [], fxDpr = 1, fxDirty = false;
const CCOLS = ["#ff4d5e","#ffc233","#4cd964","#3d8bff","#9b5cff","#ff8a1f"];
function burst(){
  const w = app.clientWidth, h = app.clientHeight;
  for(let i=0;i<160;i++){
    confetti.push({x:w*(0.2 + Math.random()*0.6), y:h*0.45, vx:(Math.random()-0.5)*700, vy:-300 - Math.random()*700,
      r:Math.random()*6.28, vr:(Math.random()-0.5)*14, s:6 + Math.random()*7, c:CCOLS[i%6]});
  }
}
function drawFx(dt){
  if(!confetti.length && !fxDirty) return;
  fctx.setTransform(fxDpr,0,0,fxDpr,0,0);
  fctx.clearRect(0,0,app.clientWidth,app.clientHeight);
  fxDirty = confetti.length > 0;
  const h = app.clientHeight;
  for(let i=confetti.length-1;i>=0;i--){
    const p = confetti[i];
    p.vy += 900*dt; p.vx *= 0.985; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt;
    if(p.y > h + 30){ confetti.splice(i,1); continue; }
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.fillStyle = p.c; fctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
    fctx.restore();
  }
}

/* =============================== INPUT =============================== */
let dragging = false, dragX = 0, dragTarget = 0;
function onDown(e){
  if(state === "menu"){ startRun(); }
  if(state === "playing"){
    dragging = true; dragX = e.clientX; dragTarget = targetX;
    if(hintTimer > 0){ hintTimer = 0.01; }
  }
}
renderer.domElement.addEventListener("pointerdown", onDown);
$("menu").querySelector(".tapzone").addEventListener("pointerdown", onDown);
window.addEventListener("pointermove", e=>{
  if(!dragging || state !== "playing") return;
  const sens = (ROAD_W*1.1) / (app.clientWidth*0.6);
  targetX = Math.max(-MAXX, Math.min(MAXX, dragTarget + (e.clientX - dragX)*sens));
});
window.addEventListener("pointerup", ()=> dragging = false);
window.addEventListener("pointercancel", ()=> dragging = false);
window.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft" || e.key==="a") keys.left = true;
  if(e.key==="ArrowRight" || e.key==="d") keys.right = true;
  if((e.key===" " || e.key==="Enter") && state==="menu" && !anyModalOpen()){ e.preventDefault(); startRun(); }
  if(e.key==="Escape" && state==="playing") pauseGame();
});
window.addEventListener("keyup", e=>{
  if(e.key==="ArrowLeft" || e.key==="a") keys.left = false;
  if(e.key==="ArrowRight" || e.key==="d") keys.right = false;
});
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && state==="playing") pauseGame(); });
const anyModalOpen = () => ["shopModal","settingsModal","pauseModal","winModal","failModal"].some(id=>!$(id).hidden);

function pauseGame(){ if(state !== "playing") return; state = "paused"; show($("pauseModal"), true); }
$("pauseBtn").addEventListener("click", ()=>{ SFX.click(); pauseGame(); });
$("resumeBtn").addEventListener("click", ()=>{ SFX.click(); show($("pauseModal"), false); state = "playing"; });
$("restartBtn").addEventListener("click", ()=>{ SFX.click(); toMenu(); startRun(); });
$("quitBtn").addEventListener("click", ()=>{ SFX.click(); toMenu(); });

$("failMenuBtn").addEventListener("click", ()=>{ SFX.click(); toMenu(); });
$("continueBtn").addEventListener("click", ()=>{

/* ---------- shop ---------- */
function figSvg(hex){
  const c = "#" + hex.toString(16).padStart(6,"0");
  return `<svg class="fig" viewBox="0 0 38 46"><circle cx="19" cy="8" r="6.5" fill="${c}" stroke="#1d2a4d" stroke-width="1.5"/>
    <rect x="12" y="15" width="14" height="16" rx="6" fill="${c}" stroke="#1d2a4d" stroke-width="1.5"/>
    <rect x="12.5" y="29" width="5" height="15" rx="2.5" fill="${c}" stroke="#1d2a4d" stroke-width="1.5"/>
    <rect x="20.5" y="29" width="5" height="15" rx="2.5" fill="${c}" stroke="#1d2a4d" stroke-width="1.5"/></svg>`;
}
function buildShop(){
  const grid = $("skinGrid"); grid.innerHTML = "";
  SKINS.forEach(s=>{
    const owned = save.owned.includes(s.id), on = save.skin === s.id;
    const b = document.createElement("button");
    b.className = "skin" + (on ? " on" : "") + (!owned ? " locked" : "");
    b.innerHTML = figSvg(s.color) + `<div class="nm">${s.name}</div>` +
      (on ? `<div class="pr" style="color:#2a9d44">EQUIPPED</div>` :
       owned ? `<div class="pr">EQUIP</div>` :
       `<div class="pr"><span class="coin"></span>${fmt(s.cost)}</div>`);
    b.addEventListener("click", ()=>{
      if(owned){ save.skin = s.id; SFX.click(); }
      else if(save.gold >= s.cost){ save.gold -= s.cost; save.owned.push(s.id); save.skin = s.id; SFX.buy(); buzz(15); }
      else { SFX.click(); return; }
      persist(); applySkin(); buildShop(); refreshMenu();
    });
    grid.appendChild(b);
  });
}
$("shopBtn").addEventListener("click", ()=>{ SFX.click(); buildShop(); show($("shopModal"), true); });
$("shopClose").addEventListener("click", ()=>{ SFX.click(); show($("shopModal"), false); });

/* ---------- settings ---------- */
let resetArmed = false;
function syncToggles(){
  $("tSound").classList.toggle("on", save.sound);
  $("tMusic").classList.toggle("on", save.music);
  $("tVibe").classList.toggle("on", save.vibe);
  $("resetBtn").textContent = resetArmed ? "TAP AGAIN TO CONFIRM" : "RESET PROGRESS";
}
$("settingsBtn").addEventListener("click", ()=>{ SFX.click(); resetArmed = false; syncToggles(); show($("settingsModal"), true); });
$("settingsClose").addEventListener("click", ()=>{ SFX.click(); show($("settingsModal"), false); });
$("tSound").addEventListener("click", ()=>{ save.sound = !save.sound; persist(); syncToggles(); SFX.click(); });
$("tMusic").addEventListener("click", ()=>{ save.music = !save.music; persist(); syncToggles(); if(save.music){ ac(); startMusic(); } else stopMusic(); });
$("tVibe").addEventListener("click", ()=>{ save.vibe = !save.vibe; persist(); syncToggles(); buzz(20); });
$("resetBtn").addEventListener("click", ()=>{
  if(!resetArmed){ resetArmed = true; syncToggles(); return; }
  const keep = {sound:save.sound, music:save.music, vibe:save.vibe};
  save = Object.assign(defSave(), keep); persist(); resetArmed = false;
  syncToggles(); applySkin(); toMenu();
});

/* =============================== LOOP =============================== */
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.fov = w/h < 0.7 ? 64 : 55;
  camera.updateProjectionMatrix();
  fxDpr = Math.min(window.devicePixelRatio||1, 2);
  fx.width = w*fxDpr; fx.height = h*fxDpr;
}
window.addEventListener("resize", resize);

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  if(state !== "paused") update(dt);
  renderer.render(scene, camera);
  drawFx(dt);
  requestAnimationFrame(loop);
}

function boot(data){
  if(data && data.save) save = Object.assign(defSave(), data.save);
  applySkin();
  resize();
  toMenu();
  camPos.set(0, 4.8, pz + 7.6);
  requestAnimationFrame(loop);
}
function begin(){
  const hot = window.claude && window.claude.hot;
  if(hot){
    try{ if(typeof hot.snapshot === "function") hot.snapshot(() => ({save})); }catch(e){}
    if(hot.ready) hot.ready(boot); else boot(hot.data || {});
  } else boot({});
}
const fontsReady = (document.fonts && document.fonts.load) ? document.fonts.load('40px "Lilita One"') : Promise.resolve();
Promise.race([fontsReady, new Promise(r=>setTimeout(r, 1500))]).then(begin, begin);
})();
</script>
