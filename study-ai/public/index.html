<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Study AI</title>
  <meta name="description" content="Study AI solves school and college homework step by step. Type it or scan it with your camera, in 16 languages.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="historyBtn" data-i18n-title="history" aria-label="History">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2"/></svg>
    </button>
    <a class="logo" href="./" aria-label="Study AI home">STUDY<span>AI</span></a>
    <div class="topbar-right">
      <button class="pill-btn hidden" id="installBtn" data-i18n="install">Install app</button>
      <label class="lang-select">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
        <select id="langSelect" data-i18n-aria="language" aria-label="Language"></select>
      </label>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="hero">
      <h1 class="glow" data-i18n="tagline">Homework solved. Step by step.</h1>
    </section>

    <section class="composer card" id="composer">
      <div class="field">
        <span class="field-label" data-i18n="level">Level</span>
        <div class="segmented" id="levelSeg" role="radiogroup">
          <button type="button" role="radio" data-value="primary" data-i18n="primary">Primary</button>
          <button type="button" role="radio" data-value="middle" data-i18n="middle">Middle school</button>
          <button type="button" role="radio" data-value="high" data-i18n="high">High school</button>
          <button type="button" role="radio" data-value="college" data-i18n="college">College / Uni</button>
        </div>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label" data-i18n="subject">Subject</span>
          <select id="subjectSelect" class="select">
            <option value="auto" data-i18n="auto">Auto-detect</option>
            <option value="math" data-i18n="math">Math</option>
            <option value="physics" data-i18n="physics">Physics</option>
            <option value="chemistry" data-i18n="chemistry">Chemistry</option>
            <option value="biology" data-i18n="biology">Biology</option>
            <option value="cs" data-i18n="cs">Computer science</option>
            <option value="economics" data-i18n="economics">Economics</option>
            <option value="history" data-i18n="historySubj">History</option>
            <option value="geography" data-i18n="geography">Geography</option>
            <option value="literature" data-i18n="literature">Literature &amp; essays</option>
            <option value="languages" data-i18n="languages">Foreign languages</option>
            <option value="philosophy" data-i18n="philosophy">Philosophy</option>
            <option value="other" data-i18n="other">Other</option>
          </select>
        </label>
        <div class="field">
          <span class="field-label" data-i18n="mode">Mode</span>
          <div class="segmented" id="modeSeg" role="radiogroup">
            <button type="button" role="radio" data-value="solve" data-i18n="solve">Solve</button>
            <button type="button" role="radio" data-value="explain" data-i18n="explain">Explain</button>
            <button type="button" role="radio" data-value="check" data-i18n="check">Check my work</button>
          </div>
        </div>
      </div>

      <textarea id="taskInput" rows="5" data-i18n-placeholder="placeholder" placeholder="Type or paste your exercise, or scan it with the camera…"></textarea>

      <div class="thumbs" id="thumbs"></div>

      <div class="actions">
        <button type="button" class="ghost-btn" id="scanBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.2"/></svg>
          <span data-i18n="scan">Scan</span>
        </button>
        <label class="ghost-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>
          <span data-i18n="upload">Photo</span>
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
        </label>
        <label class="toggle">
          <input type="checkbox" id="deepToggle">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span data-i18n="deep">Deep thinking</span>
        </label>
        <button type="button" class="primary-btn" id="solveBtn">
          <span data-i18n="go">Solve it</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
      <p class="hint"><span data-i18n="pagesHint">Up to 4 pages</span> · <span data-i18n="disclaimer">AI can make mistakes. Check important answers.</span></p>
    </section>

    <section class="thread hidden" id="thread" aria-live="polite"></section>

    <form class="followup card hidden" id="followupForm">
      <textarea id="followupInput" rows="1" data-i18n-placeholder="followUp" placeholder="Ask a follow-up question…"></textarea>
      <button type="button" class="icon-btn" id="followupPhotoBtn" data-i18n-title="upload" aria-label="Photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.2"/></svg>
      </button>
      <button type="submit" class="primary-btn compact" id="followupSend" data-i18n-title="send" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="thumbs followup-thumbs hidden" id="followupThumbs"></div>

    <div class="new-task-wrap hidden" id="newTaskWrap">
      <button type="button" class="ghost-btn" id="newTaskBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="newTask">New task</span>
      </button>
    </div>
  </main>

  <!-- History drawer -->
  <div class="scrim hidden" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="history">History</h2>
      <button class="icon-btn" id="drawerClose" data-i18n-title="close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ul class="history-list" id="historyList"></ul>
    <button class="ghost-btn danger" id="clearHistoryBtn" data-i18n="clearHistory">Clear history</button>
  </aside>

  <!-- Camera scanner -->
  <div class="camera hidden" id="camera" role="dialog" aria-modal="true">
    <video id="cameraVideo" playsinline muted autoplay></video>
    <div class="scan-frame"><i></i><i></i><i></i><i></i><div class="scan-line"></div></div>
    <div class="camera-top">
      <button class="icon-btn" id="cameraClose" data-i18n-title="close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <span class="camera-count" id="cameraCount"></span>
      <button class="icon-btn" id="cameraFlip" data-i18n-title="flip" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1Z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2M14.5 9v2h-2M9.5 17v-2h2"/></svg>
      </button>
    </div>
    <div class="camera-bottom">
      <button class="shutter" id="cameraShutter" data-i18n-title="capture" aria-label="Capture"><span></span></button>
      <button class="pill-btn" id="cameraDone">✓</button>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>

  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
